
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_training_p1'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_training_p1'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
on-run-start:
  - "CREATE TABLE IF NOT EXISTS {{ target.schema }}.audit_log ( model_name STRING, run_timestamp TIMESTAMP )"
  - "INSERT INTO {{ target.schema }}.audit_log (model_name, run_timestamp) VALUES ('dbt_build_started', CURRENT_TIMESTAMP())"
on-run-end:
  - "INSERT INTO {{ target.schema }}.audit_log (model_name, run_timestamp) VALUES ('dbt_build_completed', CURRENT_TIMESTAMP())"

models:
  dbt_training_p1:
    # Config indicated by + and applies to all files under models/example/
    +pre-hook:
      - "INSERT INTO {{ target.schema }}.audit_log (model_name, run_timestamp) VALUES ('{{ this.name }}', CURRENT_TIMESTAMP())"
    +post-hook:
      - "INSERT INTO {{ target.schema }}.audit_log (model_name, run_timestamp) VALUES ('{{ this.name }}', CURRENT_TIMESTAMP())"
    src:
      +pre-hook:
        - 'CREATE TABLE IF NOT EXISTS DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC (model_name STRING,execution_type STRING,run_timestamp TIMESTAMP)'
        - "INSERT INTO DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC (model_name, execution_type, run_timestamp) VALUES ('{{ this.name }}', 'PRE', CURRENT_TIMESTAMP())"
      +post-hook:
        - "INSERT INTO DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC 
         (model_name, execution_type, run_timestamp)
         VALUES ('{{ this.name }}', 'POST', CURRENT_TIMESTAMP())"
      +materialized: ephemeral
    dim:
      +pre-hook:
        - 'CREATE TABLE IF NOT EXISTS DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC (model_name STRING,execution_type STRING,run_timestamp TIMESTAMP)'
        - "INSERT INTO DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC (model_name, execution_type, run_timestamp) VALUES ('{{ this.name }}', 'PRE', CURRENT_TIMESTAMP())"
      +post-hook:
        - "INSERT INTO DBT_LANDING.DBT_LANDING_SCHEMA.audit_log_SRC 
         (model_name, execution_type, run_timestamp)
         VALUES ('{{ this.name }}', 'POST', CURRENT_TIMESTAMP())"
      +materialized: view
    mart:
      +materialized: table
      +transient: false
seeds: 
  dbt_training_p1:
    +quote_columns: true
    +schema: seeds

    employee_details:
      +alias: employee
      +column_types:
        employee_id: string
        first_name: string
        last_name: string
        email: string
        department: string
        job_title: string
        salary_inr: integer
        city: string
        date_of_joining: date
        employment_status: string

vars: 
  friday_val: 100
      
